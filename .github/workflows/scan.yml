name: Scan

# Новые уязвимости появляются и у неизменного образа: раз в неделю сканируем опубликованный `latest`.
# Руками: Actions → Scan → Run workflow (или локально: tools/scan-image.sh <образ>, см. README «Сканирование образа»).
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      image:
        description: 'Образ для сканирования (по умолчанию latest из ghcr)'
        required: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Сканирование образа и SBOM
        env:
          IMAGE: ${{ inputs.image || 'ghcr.io/bx-shef/file-extract:latest' }}
          SCAN_EXIT: '1'  # еженедельный просмотр: красный прогон — сигнал владельцу
        run: bash tools/scan-image.sh "$IMAGE" scan-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scan-latest
          path: |
            scan-out/report.txt
            scan-out/sbom.cdx.json
          if-no-files-found: ignore
