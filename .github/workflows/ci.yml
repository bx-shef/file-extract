name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # глубина 2: слияние PR и его родители; база сравнения — первый родитель (HEAD^1), для шага «Уровень ревью PR»
          persist-credentials: false

      # Уровень ревью PR (tools/review-tier.sh): справочно, ничего не блокирует; CI не знает, проведено ли ревью.
      # continue-on-error не снимать без решения владельца. Правила — tools/review-tier.rules.
      - name: Уровень ревью PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          action="$(bash tools/review-tier.sh --base HEAD^1 --action)"
          printf '%s\n' "$action"
          {
            echo '### Уровень ревью PR (справочно: проведено ли ревью, CI не проверяет)'
            printf '%s\n\n' "$action"
            echo 'По файлам — локально: `bash tools/review-tier.sh --explain`'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    # На PR — только сборка (проверка, что все программы разбора в образе запускаются).
    # Права на запись пакетов здесь НЕТ: сборка чужого PR не должна держать токен публикации.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: file-extract:ci
          cache-from: type=gha
      # Сканер образа (Trivy) и SBOM — tools/scan-image.sh (тот же скрипт запускают руками). Порог HIGH/CRITICAL с
      # исправлением; исключения — .trivyignore (с причиной и сроком). Пока без падения (SCAN_EXIT ниже).
      - name: Сканирование образа и SBOM
        env:
          # 0 — только отчёт (в базовом образе node:22-slim сейчас есть исправимые HIGH); 1 — падать. Переключает владелец.
          SCAN_EXIT: '0'
        run: bash tools/scan-image.sh file-extract:ci scan-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scan-pr
          path: |
            scan-out/report.txt
            scan-out/sbom.cdx.json
          if-no-files-found: ignore

  publish:
    # Только push в main: сборка и публикация в GHCR. `packages: write` — только у этой джобы.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Сначала сборка в локальный образ и сканирование: при SCAN_EXIT=1 образ с исправимой HIGH/CRITICAL в ghcr не уходит.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: file-extract:ci
          cache-from: type=gha
      - name: Сканирование образа и SBOM
        env:
          # 0 — только отчёт (в базовом образе node:22-slim сейчас есть исправимые HIGH); 1 — падать. Переключает владелец.
          SCAN_EXIT: '0'
        run: bash tools/scan-image.sh file-extract:ci scan-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scan-${{ github.sha }}
          path: |
            scan-out/report.txt
            scan-out/sbom.cdx.json
          if-no-files-found: ignore
      # Публикация: provenance (mode=max — откуда и из чего собрано) и SBOM BuildKit кладёт в сам образ как аттестации.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/bx-shef/file-extract:latest
            ghcr.io/bx-shef/file-extract:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
